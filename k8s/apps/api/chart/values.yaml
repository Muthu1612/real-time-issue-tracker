replicaCount: 2

image:
  repository: real-time-issue-tracker/backend
  tag: kind
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80

containerPort: 4000

env:
  PORT: "4000"

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 256Mi

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 10001
  capabilities:
    drop:
      - ALL

probe:
  path: /health
  initialDelaySeconds: 3
  periodSeconds: 10
  timeoutSeconds: 2
  failureThreshold: 3